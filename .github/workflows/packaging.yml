# Packaging: build signed installers on release tags.
#
# Pushing a tag like v0.2.0 builds:
#   - Windows: CopilotUsageTracker-Setup-0.2.0.exe (Inno Setup)
#   - macOS:   CopilotUsageTracker-0.2.0.dmg (drag-to-Applications)
# and attaches both to the GitHub Release.
#
# Optional secrets for trusted distribution:
#   APPLE_CODESIGN_IDENTITY - "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD - for notarization
#   CODESIGN_THUMBPRINT - Windows code-signing certificate thumbprint
#     (removes the SmartScreen "Unknown publisher" prompt)
# Without them the macOS build is ad-hoc signed (Gatekeeper will warn)
# and the Windows installer is unsigned (SmartScreen will warn).

name: Packaging

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual "Run workflow" button / API dispatch

permissions:
  contents: write
  id-token: write      # build-provenance attestation
  attestations: write  # build-provenance attestation

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/dist/CopilotUsageTracker-Setup-*.exe

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DMG
        run: bash packaging/macos/build.sh
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      - name: Notarize (skips itself when APPLE_ID is unset)
        run: bash packaging/macos/notarize.sh packaging/macos/dist/CopilotUsageTracker-*.dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: packaging/macos/dist/CopilotUsageTracker-*.dmg

  release:
    needs: [windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # SBOM: dependency list for security review of each release.
      - name: Generate SBOM
        run: |
          pip install -q -e ".[desktop,dashboard]" 2>/dev/null || pip install -q -e .
          pip freeze --exclude-editable > dist/CopilotUsageTracker.sbom.txt
      # SLSA build provenance: proves each installer was built by this
      # workflow from the tagged commit (verifiable with `gh attestation verify`).
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Genuine end-to-end validation on a real Windows machine: clicks through
  # the actual installer wizard, screenshots every page, verifies the
  # installed files, launches the app and screenshots first-run setup.
  # Screenshots are uploaded as the `windows-screenshots` artifact and then
  # committed to docs/screenshots/ for the README. Runs after (and never
  # blocks) the release.
  windows-smoke:
    needs: [windows-installer]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: smoke
      - name: Install wizard walkthrough + screenshots
        shell: pwsh
        working-directory: smoke
        run: |
          Copy-Item ../packaging/windows/capture-screenshots.ps1 .
          ./capture-screenshots.ps1
      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: smoke/screenshots/*.png
