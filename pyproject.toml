[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-usage-tracker"
version = "0.1.0"
description = "Open-source enterprise usage & cost tracking for GitHub Copilot: token usage, dollar spend, team attribution, budgets, and ROI insights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sanjay Santhanam" }]
keywords = ["github", "copilot", "finops", "cost-tracking", "enterprise"]
dependencies = [
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "Pillow>=10",
]
dashboard = [
    "streamlit>=1.32",
    "pandas>=2.0",
]
desktop = [
    "pystray>=0.19",
    "pywebview>=4.0",
    "Pillow>=10",
]

[project.scripts]
copilot-usage = "copilot_usage_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
